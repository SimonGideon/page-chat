# MinIO Console — https://minio.simongideon.me
# S3 API        — https://minio.simongideon.me:9000  (used by Rails Active Storage)
#
# DNS required: A record  minio.simongideon.me → 89.167.4.31
# SSL:  certbot certonly --webroot -w /var/www/certbot -d minio.simongideon.me

# HTTP → HTTPS + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name minio.simongideon.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# MinIO Console (UI) — port 9001
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio.simongideon.me;

    ssl_certificate     /etc/letsencrypt/live/minio.simongideon.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.simongideon.me/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MinIOSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allow large uploads
    client_max_body_size 1G;
    proxy_request_buffering off;

    # Console UI
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-NginX-Proxy      true;

        # Required for MinIO console WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900;
        chunked_transfer_encoding off;
    }
}

