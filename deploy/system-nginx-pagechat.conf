# Page Chat - https://pagechat.simongideon.me
# Admin panel: https://pagechat.simongideon.me/admin
# SSL certs: /etc/letsencrypt/live/pagechat.simongideon.me/

# HTTP: ACME challenges + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pagechat.simongideon.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Legacy admin subdomain → main domain /admin
server {
    listen 80;
    listen [::]:80;
    server_name pagechatadmin.simongideon.me;

    return 301 https://pagechat.simongideon.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pagechatadmin.simongideon.me;

    ssl_certificate /etc/letsencrypt/live/pagechat.simongideon.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pagechat.simongideon.me/privkey.pem;

    return 301 https://pagechat.simongideon.me$request_uri;
}

# App + API + admin
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pagechat.simongideon.me;

    ssl_certificate /etc/letsencrypt/live/pagechat.simongideon.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pagechat.simongideon.me/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PageChatSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
